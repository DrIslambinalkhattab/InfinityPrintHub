<style>

.rw__controls{display:none!important}

:focus-visible{outline-color:#B8842A!important}
.rw__items{scrollbar-width:thin;scrollbar-color:#d9d4c8 transparent}
.empty-state{min-height:calc(100svh - 88px);display:grid;place-items:center;text-align:center;padding:48px 24px;background:radial-gradient(60% 50% at 50% 38%,#fbf7ee,#fff)}

</style>
<style>

.rw__detail{display:none;flex:1 1 auto;min-height:0;flex-direction:column}

.rw__dtitle{margin:0;font-weight:500;font-size:24px;line-height:1.15;letter-spacing:-.01em}.rw__ddesc{margin:0;font-size:13px;line-height:1.6;color:#66625c}

  <script>
/* ==========================================================
   DATA — الداتا كلها في data/products.json (بتتعدل من admin.html)
   ========================================================== */
const SITE={whatsapp:'201000000000',waText:'Hello, I would like to ask about your products.',waProductText:'Hello, I would like to ask about: ',waBundleText:'Hello, I would like to ask about the full set: ',currency:''};
const IMG_PATH='images/';
let PRODUCT_DATA={},COLLECTIONS=[],LOOKS=[],COUNT=0,SLOTS=0;
const buildLooks=d=>{PRODUCT_DATA={};Object.assign(SITE,d.site||{});
  COLLECTIONS=(d.collections||[]).map((c,ci)=>{const sheet=c.mode==='sheet',cimg=sheet&&c.image?`c${ci}img`:null;if(cimg)PRODUCT_DATA[cimg]={name:'',desc:'',image:c.image};
    const list=sheet&&!cimg?[]:(c.products||[]).filter(p=>p&&p.name&&(!sheet||Array.isArray(p.box)));
    return{name:c.name||'Untitled',description:c.description||'',icon:c.icon||'fa-box-open',cimg,bundle:+c.bundlePrice||0,bundleOld:+c.bundleOld||0,badge:c.badge||'',products:list.map((p,pi)=>{const id=`c${ci}p${pi}`;PRODUCT_DATA[id]=sheet?{name:p.name,desc:p.desc||'',box:p.box,skip:1}:{name:p.name,desc:p.desc||'',image:p.image||id};Object.assign(PRODUCT_DATA[id],{price:+p.price||0,oldPrice:+p.oldPrice||0,note:p.note||'',badge:p.badge||''});return id})}});
  LOOKS=COLLECTIONS.filter(c=>c.products.length);COUNT=LOOKS.length;SLOTS=COUNT*2};
const loadData=()=>new Promise(res=>{let fin=false;const done=d=>{if(fin)return;fin=true;try{buildLooks(d||{})}catch(e){console.warn(e);buildLooks({})}res()};
  const grab=()=>fetch('data/products.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(done).catch(()=>done({}));
  if(new URLSearchParams(location.search).has('preview')&&parent!==window){const t=setTimeout(grab,2500);addEventListener('message',e=>{if(e.origin===location.origin&&e.data&&e.data.type==='ipb-data'){clearTimeout(t);done(e.data.data)}});parent.postMessage({type:'ipb-ready'},location.origin)}else grab()});
const showEmpty=()=>{const e=document.createElement('section');e.className='empty-state';e.innerHTML='<div><i class="fa-solid fa-layer-group"></i><h2>Our catalog is being prepared</h2><p>New collections will appear here very soon.</p></div>';document.querySelector('runway-section').replaceWith(e)};

/* ---------- Engine ---------- */
const AR=.8; /* نسبة كارت العرض 4:5 */
const LAYOUTS={ /* [x,y,w,h] بالنسبة المئوية داخل الكارت، حسب عدد المنتجات */
  1:[[12,9,76,82]],
  2:[[9,5,82,45],[9,52,82,43]],
  3:[[7,5,86,50],[6,59,45,35],[49,59,45,35]],
  4:[[6,6,45,41],[49,6,45,41],[6,53,45,41],[49,53,45,41]]
};
const gridLayout=n=>{const c=Math.ceil(Math.sqrt(n*AR)),r=Math.ceil(n/c),P=5,G=2.4,w=(100-2*P-G*(c-1))/c,h=(100-2*P-G*(r-1))/r;return Array.from({length:n},(_,i)=>{const row=Math.floor(i/c),inRow=row===r-1?n-c*(r-1):c,off=(c-inRow)*(w+G)/2;return[P+off+(i%c)*(w+G),P+row*(h+G),w,h]})};
const IMG_EXT=['webp','png','jpg','jpeg','avif'];
const probeImage=url=>new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src=url});
function detectAlpha(im){try{const w=32,h=Math.max(1,Math.round(32*im.naturalHeight/im.naturalWidth));const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,w,h);const d=x.getImageData(0,0,w,h).data;let t=0;for(const[px,py]of[[0,0],[w-1,0],[0,h-1],[w-1,h-1]])if(d[(py*w+px)*4+3]<200)t++;return t>=3}catch(_){return false}}
async function resolveProduct(p){p.src=null;p.alpha=false;if(p.skip)return;const direct=/^(data:|blob:|https?:)/.test(p.image);const base=direct?p.image:IMG_PATH+p.image;const list=direct||/\.(webp|png|jpe?g|avif|gif|svg)$/i.test(p.image)?[base]:IMG_EXT.map(e=>`${base}.${e}`);for(const u of list){const im=await probeImage(u);if(im){p.src=u;p.ar=im.naturalWidth/im.naturalHeight;p.alpha=detectAlpha(im);return}}}
const resolveProducts=()=>Promise.race([Promise.all(Object.values(PRODUCT_DATA).map(resolveProduct)),new Promise(r=>setTimeout(r,6000))]);

const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const modulo=(n,m)=>((n%m)+m)%m;
const lookLabel=(i)=>`Collection ${i+1}: ${LOOKS[i].name}`;

const pad=n=>String(n).padStart(2,'0');
const waLink=t=>`https://wa.me/${SITE.whatsapp}?text=${encodeURIComponent(t)}`;
const compRect=look=>{const c=PRODUCT_DATA[look.cimg],a=c.ar||1,sw=AR*(1-4/50),sh=1-4/50;let rw=sw,rh=rw/a;if(rh>sh){rh=sh;rw=rh*a}const w=rw/AR*100,h=rh*100;return[(100-w)/2,(100-h)/2,w,h]};
const slotRects=look=>{if(look.cimg){const r=compRect(look);return look.products.map(id=>{const b=PRODUCT_DATA[id].box;return[r[0]+b[0]*r[2]/100,r[1]+b[1]*r[3]/100,b[2]*r[2]/100,b[3]*r[3]/100]})}return LAYOUTS[look.products.length]||gridLayout(look.products.length)};
function compMarkup(look){
  if(look.cimg){const c=PRODUCT_DATA[look.cimg],r=compRect(look);return `<div class="rw__comp"><span class="rw__slot${c.alpha?' has-alpha':''}${c.src?'':' is-missing'}" style="--x:${r[0]}%;--y:${r[1]}%;--w:${r[2]}%;--h:${r[3]}%">${c.src?`<img src="${c.src}" alt="" decoding="async" draggable="false">`:`<i class="fa-solid ${look.icon||'fa-box-open'}" aria-hidden="true"></i>`}</span></div>`}
  const rects=slotRects(look);
  return `<div class="rw__comp">${look.products.map((id,n)=>{const p=PRODUCT_DATA[id],r=rects[n];
    const inner=p.src?`<img src="${p.src}" alt="" decoding="async" draggable="false">`:`<i class="fa-solid ${look.icon||'fa-box-open'}" aria-hidden="true"></i>`;
    return `<span class="rw__slot${p.alpha?' has-alpha':''}${p.src?'':' is-missing'}" style="--x:${r[0]}%;--y:${r[1]}%;--w:${r[2]}%;--h:${r[3]}%">${inner}</span>`}).join('')}</div>`;
}
function modelMarkup(i,clone=false){
  const look=LOOKS[i];
  return `<div class="rw__model" data-rw-model data-index="${i}" data-slot="${clone?i+COUNT:i}" aria-hidden="true"${clone?' data-rw-clone':''}>
    <span class="rw__shadow"></span><div class="rw__figure" style="--rw-ar:${AR}"><div class="rw__art">${compMarkup(look)}<button class="rw__hit" data-rw-go="${i}" aria-label="${escapeHTML(lookLabel(i))}" tabindex="-1"></button></div></div></div>`;
}
function heroMarkup(i){
  const look=LOOKS[i];const rects=slotRects(look);const pins=look.products.map((id,n)=>`<button class="rw__pin" data-rw-pin="${n+1}" data-tip="${escapeHTML(PRODUCT_DATA[id].name)}" style="--pin-x:${rects[n][0]+rects[n][2]/2}%;--pin-y:${rects[n][1]+rects[n][3]/2}%;--pi:${n+1}" aria-label="${n+1}: ${escapeHTML(PRODUCT_DATA[id].name)}" tabindex="-1"><span class="rw__pin-dot">${n+1}</span></button>`).join('');
  return `<div class="rw__hero${i===0?' is-on':''}" data-rw-hero data-index="${i}" data-name="${escapeHTML(look.name)}" data-label="${escapeHTML(lookLabel(i))}" aria-hidden="${i===0?'false':'true'}"><div class="rw__morph"><span class="rw__shadow"></span><div class="rw__figure" style="--rw-ar:${AR}"><div class="rw__art">${compMarkup(look)}<button class="rw__zoom" data-rw-zoom aria-label="View collection: ${escapeHTML(look.name)}" tabindex="${i===0?'0':'-1'}"></button><div class="rw__pins">${pins}</div></div></div></div></div>`;
}
function lookRowMarkup(cur,j){
  const l=LOOKS[j];const n=j+1;const c=l.products.length;

const bootRunway=()=>{if(!COUNT){showEmpty();return}if(!customElements.get('runway-section'))customElements.define('runway-section',RunwaySection);initWheel()};
loadData().then(()=>{initContact();return resolveProducts()}).catch(()=>{}).then(bootRunway);

const runway=document.querySelector('runway-section');
const initWheel=()=>{const st=runway.querySelector('[data-rw-stage]');if(!st)return;let acc=0,lock=0,idle=0;st.addEventListener('wheel',e=>{if(runway.zoomed||e.ctrlKey)return;const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;if(!d)return;e.preventDefault();const now=performance.now();clearTimeout(idle);idle=setTimeout(()=>{acc=0},140);if(now<lock)return;acc+=d;if(Math.abs(acc)>=48){const dir=acc>0?1:-1;acc=0;lock=now+520;runway.engage?.();runway.moveTo(Math.round(runway.target)+dir)}},{passive:false})};
runway.addEventListener('keydown',e=>{const r=e.target.closest&&e.target.closest('[data-rw-jump]');if(r&&(e.key==='Enter'||e.key===' ')){e.preventDefault();r.click()}});
window.addEventListener('click',e=>{if(performance.now()<(runway._suppressClickUntil||0)){e.preventDefault();e.stopImmediatePropagation()}},true);


const initContact=()=>{const WA_NUMBER=SITE.whatsapp,WA_TEXT=SITE.waText;const pretty='+'+WA_NUMBER.replace(/^(\d{2})(\d{3})(\d{3})(\d+)$/,'$1 $2 $3 $4');
document.querySelectorAll('[data-wa-display]').forEach(e=>e.textContent=pretty);
document.querySelectorAll('[data-wa-open]').forEach(a=>a.href='https://wa.me/'+WA_NUMBER+'?text='+encodeURIComponent(WA_TEXT));
document.querySelector('[data-call]').href='tel:+'+WA_NUMBER;
const d=document.getElementById('contact-dialog'),t=document.querySelector('[data-contact-open]');
t.addEventListener('click',()=>{d.showModal();t.setAttribute('aria-expanded','true')});
const close=()=>{d.close();t.setAttribute('aria-expanded','false')};
d.addEventListener('close',()=>t.setAttribute('aria-expanded','false'));
d.querySelector('[data-contact-close]').addEventListener('click',close);
d.addEventListener('click',e=>{const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close()});
const cb=d.querySelector('[data-copy]'),cl=d.querySelector('[data-copy-label]');
cb.addEventListener('click',async()=>{try{await navigator.clipboard.writeText('+'+WA_NUMBER)}catch(_){const x=document.createElement('textarea');x.value='+'+WA_NUMBER;document.body.append(x);x.select();document.execCommand('copy');x.remove()}
cl.textContent='Copied';cb.classList.add('is-done');cb.querySelector('.cd__ico i').className='fa-solid fa-check';setTimeout(()=>{cl.textContent='Copy number';cb.classList.remove('is-done');cb.querySelector('.cd__ico i').className='fa-regular fa-copy'},1800)});};
</script>
